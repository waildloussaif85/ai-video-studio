    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro</title>
    
    <style>
        /* كود ذكي ومضمون: يمنع إعلان Monetag من الظهور في الغلاف ويظهره فقط في الاستوديو */
        body > script + div, 
        body > iframe,
        .top-monetag-ad {
            display: none !important;
        }

        #studio-screen[style*="display: block"] .top-monetag-ad,
        #studio-screen[style*="display: block"] ~ script + div,
        #studio-screen[style*="display: block"] ~ iframe {
            display: flex !important;
        }

        body { background-color: #0b1426; }
        #welcome-screen { width: 100%; max-width: 500px; margin: auto; text-align: center; }
        .logo-icon { font-size: 60px; background: linear-gradient(135deg, #2ecc71, #1a66ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome-title { font-size: 26px; color: #2ecc71; margin-top: 10px; }
        .welcome-desc { font-size: 14px; color: #a0aec0; margin: 15px 0; }
        .enter-btn { background: #1a66ff; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }

        
        .export-green-btn { background-color: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>

    <!-- 1. Welcome Screen -->
    <div id="welcome-screen">
        <div class="logo-icon">🎬</div>
        <h1 class="welcome-title">AI Video Studio Pro</h1>
        <p class="welcome-desc">Welcome to the advanced video production app. Create stunning slideshows with transitions, customs aspect ratios and export directly.</p>
        <button class="enter-btn" id="btn-enter-trigger">Enter Platinum Studio 🚀</button>
    </div>

    <!-- 2. Studio Screen -->
    <div id="studio-screen">
    <div class="top-monetag-ad">
        <meta name="monetag" content="40c4a8e0b3fa817290bcda4618ea4efd">
        <script>(function(s){s.dataset.zone='1203588';s.src='https://inklinkor.com';(document.head||document.body).appendChild(s)})(document.createElement('script'))</script>
    </div>
    <div class="google-ads-box">★ GOOGLE ADS BANNER PLACE ★</div>

   
        <h2 class="studio-header">AI Video Studio Pro</h2>

        <div class="control-panel-card">
            <div class="grid-options">
                <div>
                    <label for="img-input" class="action-blue-label">📸 Add Photos</label>
                    <input type="file" id="img-input" style="display: none;" multiple accept="image/*">
                </div>
                <div id="counter-output" style="color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">0 Photos loaded</div>
            </div>
        </div>

        <div class="control-panel-card">
            <div class="grid-options">
                <div class="option-group">
                    <label>Music Track</label>
                    <label for="audio-input" class="action-purple-label" style="padding: 5px; font-size: 11px;">🎵 Add Audio</label>
                    <input type="file" id="audio-input" style="display: none;" accept="audio/*">
                </div>
                <div class="option-group">
                    <label>Text Color</label>
                    <input type="color" id="text-color-input" value="#ffffff">
                </div>
            </div>
            <div class="option-group">
                <input type="text" id="video-text-input" placeholder="Type text here to show on video...">
            </div>
        </div>

        <div class="control-panel-card">
            <div class="grid-options">
                <div class="option-group">
                    <label>Aspect Ratio</label>
                    <div class="ratio-selector">
                        <button class="ratio-btn active" data-ratio="16:9">📺 16:9</button>
                        <button class="ratio-btn" data-ratio="9:16">📱 9:16</button>
                        <button class="ratio-btn" data-ratio="1:1">⬛ 1:1</button>
                    </div>
                </div>
                <div class="grid-options">
                    <div class="option-group">
                        <label>Speed (<span id="duration-val">2</span>s)</label>
                        <input type="range" id="duration-slider" min="1" max="5" value="2" step="0.5" style="width:100%;">
                    </div>
                    <div class="option-group">
                        <label>Filter</label>
                        <select id="color-filter">
                            <option value="none">None</option>
                            <option value="grayscale">Grayscale</option>
                            <option value="sepia">Sepia</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="preview-wrapper">
            <div class="preview-zone">
                <canvas id="video-canvas"></canvas>
            </div>
        </div>

        <button class="export-green-btn" id="export-btn" type="button">🎬 Save & Export Video (MP4)</button>
        
        <div class="google-ads-box">★ GOOGLE ADSENSE BANNER (BOTTOM SMART AD) ★</div>
    </div>
<div style="position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; text-align: center; background: rgba(0,0,0,0.05); padding: 5px 0;">

</body>
</html>
