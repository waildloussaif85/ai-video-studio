<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro</title>
    
    <!-- كود توثيق منصة Monetag الأساسي -->
    <meta name="monetag" content="40c4a8e0b35b1c55209770144ecbc499">
    
    <!-- كود إعلانات Monetag المزدوجة العلوي (Nice tag + Unbelievable tag) -->
    <script src="https://alwingulla.com" defer></script>
    <script>
        (function(d,z,s){
            s.src='https://'+d+'/401/'+z;
            try{(d.document.body||d.document.getElementsByTagName('head')).appendChild(s)}catch(e){}
        })('groleegni.net',748892,d.createElement('script'));
    </script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            /* هوامش ذكية لترك مساحات كافية للإعلانات فوق وتحت دون تغطية الأزرار */
            padding-top: 140px !important;
            padding-bottom: 90px !important;
            box-sizing: border-box;
        }
        .welcome-screen, .studio-screen {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .studio-screen { display: none; }
        .logo-icon { font-size: 60px; margin-bottom: 10px; }
        .enter-btn, .action-blue-label, .action-purple-label, .export-green-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .action-blue-label { background-color: #0056b3; display: block; margin-top: 5px; }
        .action-purple-label { background-color: #6f42c1; display: block; margin-top: 5px; }
        .export-green-btn { background-color: #28a745; margin-top: 25px; }
        .control-panel-card {
            background-color: #1c2541;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .option-group { display: flex; flex-direction: column; }
        .option-group select, .option-group input[type="text"], .option-group input[type="color"] {
            background-color: #5bc0be;
            color: #1c2541;
            border: none;
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            font-weight: bold;
        }
        .ratio-selector { display: flex; gap: 6px; justify-content: space-between; margin-top: 5px; }
        .ratio-btn { flex: 1; background: #162238; border: 1px solid #5bc0be; color: white; padding: 6px; border-radius: 4px; cursor: pointer; }
        .ratio-btn.active { background: #1a66ff; border-color: #1a66ff; }
        .preview-wrapper { width: 100%; display: flex; justify-content: center; margin-top: 15px; }
        .preview-zone { width: 100%; height: 210px; display: flex; justify-content: center; background: #000; border-radius: 6px; overflow: hidden; }
        #video-canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <!-- 1. واجهة الغلاف والترحيب النظيفة بالكامل بدون إعلانات مشوهة -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="logo-icon">🎬</div>
        <h1 class="welcome-title">AI Video Studio Pro</h1>
        <p class="welcome-desc">Bienvenue dans l'application de production vidéo avancée. Créez des diaporamas époustouflants avec des transitions, des formats d'image personalizados et exportez-les directement.</p>
        <button class="enter-btn" id="btn-enter-trigger" type="button">Entrez dans Platinum Studio 🚀</button>
    </div>

    <!-- 2. واجهة استوديو صناعة الفيديوهات -->
    <div id="studio-screen" class="studio-screen">
        <h2 class="studio-header">AI Video Studio Pro</h2>

        <div class="control-panel-card">
            <div class="grid-options">
                <div class="option-group">
                    <label for="img-input" class="action-blue-label">📸 Ajouter des photos</label>
                    <input type="file" id="img-input" multiple accept="image/*" style="display:none;">
                </div>
                <div id="counter-output" style="color:#5bc0be; font-weight:bold; align-self:center;">0 photos chargées</div>
            </div>
        </div>

        <div class="control-panel-card">
            <div class="grid-options">
                <div class="option-group">
                    <label>Music Track</label>
                    <label for="audio-input" class="action-purple-label">🎵 Ajouter de l'audio</label>
                    <input type="file" id="audio-input" accept="audio/*" style="display:none;">
                </div>
                <div class="option-group">
                    <label>Text Color</label>
                    <input type="color" id="text-color-picker" value="#ffffff">
                </div>
            </div>
            <div class="option-group" style="margin-top:10px;">
                <input type="text" id="video-text-input" placeholder="Saisissez ici le texte à afficher dans la vidéo...">
            </div>
        </div>

        <div class="control-panel-card">
            <div class="grid-options">
                <div class="option-group">
                    <label>Aspect Ratio</label>
                    <div class="ratio-selector">
                        <button class="ratio-btn active" data-ratio="16:9">📺 16:9</button>
                        <button class="ratio-btn" data-ratio="9:16">📱 9:16</button>
                        <button class="ratio-btn" data-ratio="1:1">⬛ 1:1</button>
                    </div>
                </div>
                <div class="grid-options" style="margin-top:0;">
                    <div class="option-group">
                        <label>Vitesse (<span id="duration-val">2s</span>)</label>
                        <input type="range" id="duration-slider" min="1" max="5" value="2">
                    </div>
                    <div class="option-group">
                        <label>Filtre</label>
                        <select id="color-filter">
                            <option value="none">Aucun</option>
                            <option value="grayscale">N&B</option>
                            <option value="sepia">Sépia</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="preview-wrapper">
            <div class="preview-zone">
                <canvas id="video-canvas"></canvas>
            </div>
        </div>

        <button class="export-green-btn" id="export-btn" type="button">🎬 Save & Export Video (MP4)</button>
    </div>

    <!-- زر تحميل صغير ودائري وأنيق مثبت على جانب الشاشة الأيمن بشكل دائم ومربوط بميديا فاير -->
    <a href="https://mediafire.com" target="_blank" style="position: fixed; right: 15px; bottom: 80px; z-index: 99999; background-color: #007bff; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 22px;" title="Télécharger APK">
        📥
    </a>

    <!-- حاوية لتثبيت إعلان Adsterra أسفل الشاشة تماماً ومنع حركته -->
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; text-align: center; background: rgba(0,0,0,0.05); padding: 5px 0;">
        <script type="text/javascript">
            atOptions = {
                'key' : 'fe84c7e492d0501f0d0388a65cc2448a',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://dcengg.org"></script>
    </div>

    <!-- استدعاء ملف الجافا سكريبت الخارجي الأساسي للتطبيق -->
    <script src="script.js"></script>
</body>
</html>
